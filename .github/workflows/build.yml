name: Linux server

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Test Go core
        working-directory: core
        run: |
          go vet ./...
          go test ./...
      - name: Check embedded dashboard JavaScript
        run: node --check core/internal/service/web/app.js
      - name: Check shell scripts
        run: bash -n install.sh core/scripts/install-systemd.sh scripts/build-linux-core.sh

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Verify release tag
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build Linux server archives
        run: bash scripts/build-linux-core.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-server
          path: dist/arman-vpn-core-linux-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-server
          path: release
      - name: Generate checksums
        run: (cd release && sha256sum *.tar.gz > SHA256SUMS.txt)
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "Arman VPN server ${GITHUB_REF_NAME#v}" --generate-notes
